name: Mega Man Alligator checks

on:
  push:
    branches:
      - alligator-fractal3-clean-test
      - mega-man-pre-alligator-20261116
  pull_request:
    branches:
      - mega-man-pre-alligator-20261116
      - mega-man-bot-ui

jobs:
  alligator-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Mega Man backend
        run: python -m compileall -q mega_man_backend
      - name: Run Alligator regression tests
        working-directory: mega_man_backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s ../tests -p "test_mega_man_alligator*.py" -v
